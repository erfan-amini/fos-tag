name: Keep the app awake

on:
  schedule:
    - cron: "23 */6 * * *"      # every six hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Open the app
        run: python tools/keepalive.py https://fos-tag.streamlit.app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: keepalive.png
          retention-days: 3
      - name: Keep this schedule enabled
        # GitHub switches off scheduled workflows after 60 days without a commit.
        # Once the last commit is 40 days old, write a timestamp and push it.
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Keep the scheduled workflow enabled"
            git push
          else
            echo "last commit is recent enough"
          fi
