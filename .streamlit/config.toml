[theme]
base = "light"
primaryColor = "#1F5AA6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#18202C"
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
headingFont = "'Barlow Condensed':https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap"
baseFontSize = 17
baseRadius = "10px"

[theme.sidebar]
backgroundColor = "#1B2431"
secondaryBackgroundColor = "#253042"
textColor = "#E8EDF3"

[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true

[runner]
# Streamlit runs a full garbage collection after every script run by default. Every phone refreshes
# every 2 s, so with 40 phones that is 20 full collections a second, which saturated the server
# (84% of its time in a profile). Python's own garbage collector still runs as usual.
postScriptGC = false

[browser]
gatherUsageStats = false
